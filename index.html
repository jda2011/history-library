<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 동영상 도서관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 네비게이션 바 -->
  <header class="navbar">
    <div class="logo" id="navHomeBtn" style="cursor: pointer;">
      📜 역사 동영상 도서관
    </div>
    
    <!-- 비로그인 시 상단 메뉴 -->
    <nav id="guestNav" class="nav-links">
      <button id="navLoginBtn" class="btn btn-blue">로그인</button>
      <button id="navRegisterBtn" class="btn btn-green">회원가입</button>
    </nav>

    <!-- 로그인 시 상단 메뉴 -->
    <nav id="userNav" class="nav-links" style="display: none;">
      <span class="user-welcome"><b id="userNicknameDisplay">사용자</b>님 환영합니다!</span>
      <button id="navMyRoomBtn" class="btn btn-gray">내 방</button>
      <button id="navAdminBtn" class="btn btn-orange" style="display: none;">🛠️ 관리자 방</button>
      <button id="navLogoutBtn" class="btn btn-red">로그아웃</button>
    </nav>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="main-container">

    <!-- 1. 메인 홈 (영상 목록) -->
    <section id="homeSection" class="content-section">
      <h2 class="section-title">🎬 역사 동영상 목록</h2>
      <div id="videoList" class="video-grid">
        <p>영상을 불러오는 중입니다...</p>
      </div>
    </section>

    <!-- 2. 로그인 화면 -->
    <section id="loginSection" class="content-section" style="display: none;">
      <div class="auth-card">
        <h2>로그인</h2>
        <form id="loginForm">
          <div class="input-group">
            <label for="loginUsername">이메일</label>
            <input type="email" id="loginUsername" placeholder="example@email.com" required>
          </div>
          <div class="input-group">
            <label for="loginPw">비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호 입력" required>
          </div>
          <button type="submit" class="btn btn-blue full-btn">로그인하기</button>
        </form>
      </div>
    </section>

    <!-- 3. 회원가입 화면 -->
    <section id="registerSection" class="content-section" style="display: none;">
      <div class="auth-card">
        <h2>회원가입</h2>
        <form id="registerForm">
          <div class="input-group">
            <label for="regEmail">이메일 주소</label>
            <input type="email" id="regEmail" placeholder="example@email.com" required>
          </div>
          <div class="input-group">
            <label for="regPw">비밀번호</label>
            <input type="password" id="regPw" placeholder="비밀번호 입력" required>
          </div>
          <div class="input-group">
            <label for="regUsername">닉네임</label>
            <input type="text" id="regUsername" placeholder="닉네임 입력" required>
          </div>
          <button type="submit" class="btn btn-green full-btn">회원가입하기</button>
        </form>
      </div>
    </section>

    <!-- 4. 내 방 (마이페이지) -->
    <section id="myRoomSection" class="content-section" style="display: none;">
      <div class="profile-card">
        <h2>👤 내 정보</h2>
        <p><strong>닉네임:</strong> <span id="myRoomUsername">-</span></p>
        <p><strong>이메일:</strong> <span id="myEmail">-</span></p>
      </div>
    </section>

    <!-- 관리자 방 (Admin Section) -->
<section id="adminView" class="view-section" style="display: none;">
  <div class="admin-container">
    <h2>🛠️ 관리자 대시보드</h2>
    <p class="subtitle">영상 관리 및 학습 퀴즈를 등록하고 관리합니다.</p>

    <!-- 관리자 탭 메뉴 -->
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchAdminTab('video')">📹 영상 등록 및 관리</button>
      <button class="tab-btn" onclick="switchAdminTab('quiz')">🧩 퀴즈 관리</button>
      <button class="tab-btn" onclick="switchAdminTab('users')">👥 회원 관리</button>
    </div>

    <!-- 1. 영상 관리 탭 -->
    <div id="adminVideoTab" class="tab-content active">
      <div class="card-form">
        <h3>새 동영상 등록</h3>
        <form id="addVideoForm">
          <input type="text" id="videoTitle" placeholder="영상 제목" required>
          <input type="url" id="videoUrl" placeholder="YouTube URL 또는 영상 링크" required>
          <select id="videoCategory">
            <option value="ancient">고대사</option>
            <option value="goryeo">고려시대</option>
            <option value="joseon">조선시대</option>
            <option value="modern">근현대사</option>
          </select>
          <textarea id="videoDesc" placeholder="영상 설명 입력"></textarea>
          <button type="submit" class="btn-primary">영상 저장하기</button>
        </form>
      </div>
    </div>

    <!-- 2. 퀴즈 관리 탭 -->
    <div id="adminQuizTab" class="tab-content" style="display: none;">
      <div class="card-form">
        <h3>학습 퀴즈 출제</h3>
        <form id="addQuizForm">
          <input type="text" id="quizQuestion" placeholder="퀴즈 질문" required>
          <input type="text" id="quizOption1" placeholder="보기 1" required>
          <input type="text" id="quizOption2" placeholder="보기 2" required>
          <input type="text" id="quizOption3" placeholder="보기 3">
          <input type="text" id="quizOption4" placeholder="보기 4">
          <select id="quizAnswer">
            <option value="1">1번 정답</option>
            <option value="2">2번 정답</option>
            <option value="3">3번 정답</option>
            <option value="4">4번 정답</option>
          </select>
          <button type="submit" class="btn-primary">퀴즈 저장하기</button>
        </form>
      </div>
    </div>
  </div>
</section>

  </main>

  <!-- 영상 모달 -->
  <div id="videoModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h3 id="modalVideoTitle">영상 제목</h3>
      <video id="modalVideoPlayer" controls style="width:100%; max-height:400px; display:none;"></video>
      <p id="modalVideoDesc"></p>
    </div>
  </div>

  <!-- 스크립트 불러오기 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
  <script src="admin.js"></script>
</body>
</html>
