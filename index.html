<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>📜 역사 동영상 도서관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="main-header">
    <div class="logo" onclick="showSection('mainSection')">📜 역사 동영상 도서관</div>
    
    <!-- 비로그인 시 표시 -->
    <div id="authNav">
      <button class="nav-btn" onclick="showSection('loginSection')">로그인</button>
      <button class="nav-btn highlight" onclick="showSection('registerSection')">회원가입</button>
    </div>

    <!-- 로그인 시 표시 -->
    <div id="userNav" style="display:none;">
      <span id="userInfo"></span>
      <button id="adminBtn" class="nav-btn admin" style="display:none;" onclick="location.href='admin-video.html'">관리자 페이지</button>
      <button class="nav-btn" onclick="handleLogout()">로그아웃</button>
    </div>
  </header>

  <!-- 1. 메인 동영상 목록 화면 -->
  <main id="mainSection" class="content-section">
    <div class="banner">
      <h1 id="bannerTitle">환영합니다!</h1>
      <p id="bannerDesc">역사 동영상을 시청하고 퀴즈를 풀어 포인트를 획득해 보세요.</p>
    </div>
    <div id="videoContainer" class="video-grid"></div>
  </main>

  <!-- 2. 회원가입 화면 -->
  <section id="registerSection" class="content-section card-box" style="display:none;">
    <h2>회원가입</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">아이디</label>
        <input type="text" id="regUsername" placeholder="아이디를 입력하세요" required />
      </div>

      <div class="form-group password-group">
        <label for="regPassword">비밀번호</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword" placeholder="비밀번호를 입력하세요" required />
          <button type="button" class="toggle-btn" onclick="togglePassword('regPassword', this)">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="regGrade">연령대 / 학년</label>
        <select id="regGrade" required>
          <option value="">연령대 / 학년을 선택하세요</option>
          <option value="UNDER_13">만 13세 미만</option>
          <option value="ELEMENTARY_6">초등학교 6학년</option>
          <option value="MIDDLE_1">중학교 1학년</option>
          <option value="MIDDLE_2">중학교 2학년</option>
          <option value="MIDDLE_3">중학교 3학년</option>
          <option value="HIGH_1">고등학교 1학년</option>
          <option value="HIGH_2">고등학교 2학년</option>
          <option value="HIGH_3">고등학교 3학년</option>
          <option value="OVER_19">만 19세 이상 (성인)</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">가입하기</button>
    </form>
  </section>

  <!-- 3. 로그인 화면 -->
  <section id="loginSection" class="content-section card-box" style="display:none;">
    <h2>로그인</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">아이디</label>
        <input type="text" id="loginUsername" placeholder="아이디" required />
      </div>

      <div class="form-group password-group">
        <label for="loginPassword">비밀번호</label>
        <div class="input-wrapper">
          <input type="password" id="loginPassword" placeholder="비밀번호" required />
          <button type="button" class="toggle-btn" onclick="togglePassword('loginPassword', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary">로그인</button>
    </form>
  </section>

  <!-- 4. 동영상 시청 & 퀴즈 화면 -->
  <section id="quizSection" class="content-section card-box" style="display:none;">
    <button class="btn-back" onclick="showSection('mainSection')">⬅ 목록으로 돌아가기</button>
    <h2 id="quizVideoTitle">동영상 제목</h2>
    <div class="video-wrapper">
      <iframe id="quizVideoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
    
    <div id="quizContainer" class="quiz-box">
      <h3>🧩 학습 퀴즈</h3>
      <div id="quizQuestions"></div>
      <button type="button" class="btn-primary" onclick="submitQuiz()">퀴즈 정답 제출</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
