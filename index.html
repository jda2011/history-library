<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 동영상 도서관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 네비게이션 헤더 -->
  <header class="navbar">
    <div class="logo">📜 역사 동영상 도서관</div>
    <div class="nav-buttons">
      <button id="navLoginBtn" type="button" class="btn-login">로그인</button>
      <button id="navRegisterBtn" type="button" class="btn-register">회원가입</button>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main>
    <!-- 홈 화면 -->
    <div id="homeSection" class="section">
      <h1>환영합니다!</h1>
      <p>역사 동영상을 시청하고 퀴즈를 풀어 포인트를 획득해 보세요.</p>
    </div>

    <!-- 회원가입 화면 -->
    <div id="registerSection" class="section" style="display: none;">
      <h2>회원가입</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regId">아이디</label>
          <input type="text" id="regId" placeholder="아이디를 입력하세요" required />
        </div>
        
        <div class="input-group">
          <label for="regPw">비밀번호</label>
          <div class="pw-container" style="display: flex; gap: 5px;">
            <input type="password" id="regPw" placeholder="비밀번호를 입력하세요" required />
            <button type="button" id="togglePwBtn">보임</button>
          </div>
        </div>

        <!-- 연령대 조사 기능 복구 -->
        <div class="input-group">
          <label for="regAge">연령대</label>
          <select id="regAge" required>
            <option value="">선택해 주세요</option>
            <option value="10s">10대 이하</option>
            <option value="20s">20대</option>
            <option value="30s">30대</option>
            <option value="40s">40대</option>
            <option value="50s+">50대 이상</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">가입하기</button>
      </form>
    </div>

    <!-- 로그인 화면 -->
    <div id="loginSection" class="section" style="display: none;">
      <h2>로그인</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginId">아이디</label>
          <input type="text" id="loginId" placeholder="아이디를 입력하세요" required />
        </div>
        <div class="input-group">
          <label for="loginPw">비밀번호</label>
          <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" required />
        </div>
        <button type="submit" class="submit-btn">로그인</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
