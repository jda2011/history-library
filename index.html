<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 동영상 도서관</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="navbar">
    <div class="logo" id="navHomeBtn" style="cursor: pointer;">📜 역사 동영상 도서관</div>
    
    <!-- 비로그인 시 표시되는 버튼 -->
    <div class="nav-buttons" id="guestNav">
      <button id="navLoginBtn" type="button" class="btn-login">로그인</button>
      <button id="navRegisterBtn" type="button" class="btn-register">회원가입</button>
    </div>

    <!-- 로그인 시 표시되는 버튼 -->
    <div class="nav-buttons" id="userNav" style="display: none;">
      <button id="navMyRoomBtn" type="button" class="btn-myroom">👤 <span id="userNicknameDisplay">사용자</span>님의 방</button>
      <button id="navLogoutBtn" type="button" class="btn-logout">로그아웃</button>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="container">
    <!-- 1. 홈 화면 -->
    <div id="homeSection" class="section">
      <h1>🎬 역사 동영상 시청하기</h1>
      <p id="welcomeMsg">로그인 후 다양한 역사 동영상을 시청해보세요!</p>

      <!-- 시대별 부록 카테고리 탭 -->
      <div class="era-tabs">
        <button class="era-btn active" data-era="all">전체</button>
        <button class="era-btn" data-era="ancient">🏛️ 고대</button>
        <button class="era-btn" data-era="medieval">⚔️ 중세</button>
        <button class="era-btn" data-era="early-modern">📜 근세</button>
        <button class="era-btn" data-era="modern">🚂 근대</button>
        <button class="era-btn" data-era="contemporary">🏙️ 현대</button>
      </div>
      
      <!-- 영상 목록 -->
      <div class="video-grid" id="videoList"></div>
    </div>

    <!-- 2. 개인 방 (마이페이지) -->
    <div id="myRoomSection" class="section" style="display: none;">
      <h2>👤 <span id="myRoomUsername"></span>님의 개인 방</h2>
      <div class="my-info-card">
        <p><strong>아이디:</strong> <span id="myNickname"></span></p>
        <p><strong>이메일:</strong> <span id="myEmail"></span></p>
        <p><strong>시청 기록:</strong> <span id="watchCount">0</span>개 시청함</p>
        <p><strong>획득한 포인트:</strong> 0 PT</p>
      </div>
    </div>

    <!-- 3. 회원가입 화면 -->
    <div id="registerSection" class="section" style="display: none;">
      <h2>회원가입</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regUsername">아이디</label>
          <input type="text" id="regUsername" placeholder="사용할 아이디 입력" required />
        </div>

        <div class="input-group">
          <label for="regEmail">이메일</label>
          <input type="email" id="regEmail" placeholder="example@email.com" required />
        </div>
        
        <div class="input-group">
          <label for="regPw">비밀번호 (6자 이상 + 특수문자 1개 이상)</label>
          <div class="pw-wrapper">
            <input type="password" id="regPw" placeholder="6자 이상, 특수문자 포함" minlength="6" required />
            <button type="button" id="togglePwBtn" class="btn-toggle">보임</button>
          </div>
        </div>

        <div class="input-group">
          <label for="regAge">연령대</label>
          <select id="regAge" required>
            <option value="">선택해 주세요</option>
            <option value="초6 이하">초6 이하</option>
            <option value="중1">중1</option>
            <option value="중2">중2</option>
            <option value="중3">중3</option>
            <option value="고1">고1</option>
            <option value="고2">고2</option>
            <option value="고3 이후">고3 이후</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">가입하기</button>
      </form>
    </div>

    <!-- 4. 로그인 화면 -->
    <div id="loginSection" class="section" style="display: none;">
      <h2>로그인</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginUsername">아이디 또는 이메일</label>
          <input type="text" id="loginUsername" placeholder="아이디 또는 이메일 입력" required />
        </div>
        
        <!-- 로그인 비밀번호 입력 및 보임/숨김 버튼 -->
        <div class="input-group">
          <label for="loginPw">비밀번호</label>
          <div class="pw-wrapper">
            <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" required />
            <button type="button" id="toggleLoginPwBtn" class="btn-toggle">보임</button>
          </div>
        </div>

        <button type="submit" class="submit-btn">로그인</button>
      </form>
    </div>
  </main>

  <!-- 동영상 시청 모달 -->
  <div id="videoModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-btn" id="closeModalBtn">&times;</span>
      <h2 id="modalVideoTitle">영상 제목</h2>
      <div class="video-container">
        <iframe id="modalVideoPlayer" src="" frameborder="0" allowfullscreen></iframe>
      </div>
      <p id="modalVideoDesc" style="margin-
