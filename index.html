<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 동영상 도서관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 메인 헤더 (중복 없이 1개만 배치) -->
  <header class="main-header">
    <div class="header-container">
      <h1 class="logo" onclick="showView('homeView')">📜 역사 동영상 도서관</h1>
      <nav>
        <!-- 로그인 전 -->
        <div class="auth-logged-out">
          <button type="button" class="nav-btn btn-blue" onclick="openModal('loginModal')">로그인</button>
          <button type="button" class="nav-btn btn-green" onclick="openModal('signupModal')">회원가입</button>
        </div>
        <!-- 로그인 후 -->
        <div class="auth-logged-in" style="display: none;">
          <button type="button" class="nav-btn" id="userNavBtnText" onclick="showView('myRoomView')">내 방</button>
          <button type="button" class="nav-btn" onclick="showView('adminView')">관리자 방</button>
          <button type="button" class="nav-btn btn-logout">로그아웃</button>
        </div>
      </nav>
    </div>
  </header>

  <!-- 메인 화면들 -->
  <main class="content-area">
    <!-- 1. 홈 화면 -->
    <section id="homeView" class="view-section">
      <h2 class="section-title">📚 역사 동영상 목록</h2>
      <div id="videoList" class="video-grid"></div>
    </section>

    <!-- 2. 내 방 (마이페이지) -->
    <section id="myRoomView" class="view-section" style="display: none;">
      <h2>🏠 <span id="myRoomNickname">사용자</span>님의 방</h2>
      <p>이메일: <span id="myRoomEmail">-</span></p>
    </section>

    <!-- 3. 관리자 센터 -->
    <section id="adminView" class="view-section" style="display: none;">
      <h2>🛠️ 관리자 센터</h2>
      <!-- 영상 등록 폼 -->
      <form id="addVideoForm" class="admin-form">
        <h3>영상 등록</h3>
        <input type="text" id="videoCategory" placeholder="카테고리 (예: 조선시대)" required>
        <input type="text" id="videoTitle" placeholder="영상 제목" required>
        <input type="url" id="videoUrl" placeholder="YouTube Embed URL" required>
        <textarea id="videoDesc" placeholder="영상 설명"></textarea>
        <button type="submit" class="btn-submit btn-blue">영상 게시하기</button>
      </form>
    </section>
  </main>

  <!-- 로그인 모달 -->
  <div id="loginModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
      <h2 class="modal-title">로그인</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label for="loginPassword">비밀번호</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('loginPassword', this)">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-submit btn-blue">로그인하기</button>
      </form>
    </div>
  </div>

  <!-- 회원가입 모달 -->
  <div id="signupModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('signupModal')">&times;</span>
      <h2 class="modal-title">회원가입</h2>
      <form id="signupForm">
        <div class="input-group">
          <label for="signupEmail">이메일 주소</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" required>
        </div>

        <div class="input-group">
          <label for="signupPassword">비밀번호</label>
          <div class="password-wrapper">
            <input type="password" id="signupPassword" placeholder="비밀번호 입력" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('signupPassword', this)">👁️</button>
          </div>
        </div>

        <div class="input-group">
          <label for="signupNickname">닉네임</label>
          <input type="text" id="signupNickname" placeholder="닉네임 입력" required>
        </div>

        <div class="input-group">
          <label for="signupAge">연령 (나이)</label>
          <input type="number" id="signupAge" placeholder="예: 15" min="1" max="120">
        </div>

        <button type="submit" class="btn-submit btn-green">회원가입하기</button>
      </form>
    </div>
  </div>

  <!-- Supabase CDN (별도 supabase.js 없어도 작동하도록 직접 CDN 연결) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
