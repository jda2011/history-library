<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사 동영상 도서관</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📜</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="navbar">
    <div class="logo" id="navHomeBtn" style="cursor: pointer;">📜 역사 동영상 도서관</div>
    <div class="nav-buttons">
      <button id="navLoginBtn" type="button" class="btn-login">로그인</button>
      <button id="navRegisterBtn" type="button" class="btn-register">회원가입</button>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="container">
    <!-- 1. 홈 화면 -->
    <div id="homeSection" class="section">
      <h1>환영합니다!</h1>
      <p>역사 동영상을 시청하고 퀴즈를 풀어 포인트를 획득해 보세요.</p>
    </div>

    <!-- 2. 회원가입 화면 -->
    <div id="registerSection" class="section" style="display: none;">
      <h2>회원가입</h2>
      <form id="registerForm">
        <div class="input-group">
          <label for="regEmail">이메일</label>
          <input type="email" id="regEmail" placeholder="example@email.com" required />
        </div>
        
        <div class="input-group">
          <label for="regPw">비밀번호 (6자 이상 + 특수문자 1개 이상)</label>
          <div class="pw-wrapper">
            <input type="password" id="regPw" placeholder="6자 이상, 특수문자 포함" minlength="6" required />
            <button type="button" id="togglePwBtn" class="btn-toggle">보임</button>
          </div>
        </div>

        <div class="input-group">
          <label for="regAge">연령대</label>
          <select id="regAge" required>
            <option value="">선택해 주세요</option>
            <option value="초6 이하">초6 이하</option>
            <option value="중1">중1</option>
            <option value="중2">중2</option>
            <option value="중3">중3</option>
            <option value="고1">고1</option>
            <option value="고2">고2</option>
            <option value="고3 이후">고3 이후</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">가입하기</button>
      </form>
    </div>

    <!-- 3. 로그인 화면 -->
    <div id="loginSection" class="section" style="display: none;">
      <h2>로그인</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="loginEmail">이메일</label>
          <input type="email" id="loginEmail" placeholder="이메일을 입력하세요" required />
        </div>
        <div class="input-group">
          <label for="loginPw">비밀번호</label>
          <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" required />
        </div>
        <button type="submit" class="submit-btn">로그인</button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
