<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>역사 동영상 시청 & 퀴즈</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; background: #fff8e7; padding: 20px; text-align: center; }
    .video-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    iframe { width: 100%; height: 450px; border: none; border-radius: 8px; }
    .quiz-section { display: none; margin-top: 30px; text-align: left; background: #fffbe6; padding: 20px; border-radius: 8px; }
    .quiz-card { margin-bottom: 20px; padding: 15px; border-bottom: 1px dashed #ffd700; }
    .btn-complete { padding: 12px 24px; background: #ff8c00; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<div class="video-container">
  <h2 id="videoTitle">동영상 제목을 불러오는 중...</h2>
  
  <!-- 영상 화면 -->
  <iframe id="videoPlayer" src="" allowfullscreen></iframe>
  <br><br>
  
  <!-- 영상 완료 후 퀴즈 열기 버튼 -->
  <button class="btn-complete" onclick="showQuizSection()">영상 시청 완료! 퀴즈 풀러가기 ✏️</button>

  <!-- 퀴즈 영역 -->
  <div id="quizSection" class="quiz-section">
    <h3>📝 학습 퀴즈를 풀고 포인트를 획득하세요!</h3>
    <form id="quizForm" onsubmit="submitQuizAnswers(event)">
      <div id="quizList"></div>
      <button type="submit" class="btn-complete">퀴즈 제출하기</button>
    </form>
  </div>
</div>

<script>
  let currentVideoData = null;

  // 1. 영상 및 퀴즈 정보 불러오기
  async function loadVideo(videoId) {
    try {
      const res = await fetch(`/api/videos/${videoId}`);
      currentVideoData = await res.json();

      document.getElementById('videoTitle').textContent = currentVideoData.title;
      document.getElementById('videoPlayer').src = currentVideoData.videoUrl;

      renderQuizzes(currentVideoData.quizzes);
    } catch (err) {
      alert('동영상을 불러올 수 없습니다.');
    }
  }

  // 2. 관리자가 등록한 퀴즈 화면에 그리기
  function renderQuizzes(quizzes) {
    const quizList = document.getElementById('quizList');
    quizList.innerHTML = '';

    quizzes.forEach((q, idx) => {
      const qCard = document.createElement('div');
      qCard.className = 'quiz-card';
      qCard.innerHTML = `
        <p><strong>Q${idx + 1}. ${q.question}</strong></p>
        ${q.options.map((opt, oIdx) => `
          <label style="display:block; margin: 5px 0;">
            <input type="radio" name="quiz_${idx}" value="${oIdx}" required> ${opt}
          </label>
        `).join('')}
      `;
      quizList.appendChild(qCard);
    });
  }

  function showQuizSection() {
    document.getElementById('quizSection').style.display = 'block';
  }

  // 3. 퀴즈 제출 및 포인트 정산
  async function submitQuizAnswers(e) {
    e.preventDefault();

    let correctCount = 0;
    const totalQuestions = currentVideoData.quizzes.length;

    currentVideoData.quizzes.forEach((q, idx) => {
      const selected = document.querySelector(`input[name="quiz_${idx}"]:checked`);
      if (selected && parseInt(selected.value, 10) === q.correctAnswer) {
        correctCount++;
      }
    });

    if (correctCount === totalQuestions) {
      alert(`🎉 축하합니다! 모든 퀴즈를 맞혀 포인트 ${currentVideoData.rewardPoints || 10}점을 획득하셨습니다!`);
      // 백엔드로 포인트 추가 요청 처리 위치
    } else {
      alert(`아쉬워요! ${totalQuestions}문제 중 ${correctCount}문제를 맞혔습니다. 다시 도전해 보세요!`);
    }
  }
</script>

</body>
</html>
